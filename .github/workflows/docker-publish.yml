name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Tag Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/dsci310-ia3-wzy716-docker:latest .
          docker tag ${{ secrets.DOCKER_USERNAME }}/dsci310-ia3-wzy716-docker:latest ${{ secrets.DOCKER_USERNAME }}/dsci310-ia3-wzy716-docker:1.0
          docker tag ${{ secrets.DOCKER_USERNAME }}/dsci310-ia3-wzy716-docker:latest ${{ secrets.DOCKER_USERNAME }}/dsci310-ia3-wzy716-docker:dockerfile-practice_1.1

      - name: Push Docker Image to DockerHub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/dsci310-ia3-wzy716-docker:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/dsci310-ia3-wzy716-docker:1.0
          docker push ${{ secrets.DOCKER_USERNAME }}/dsci310-ia3-wzy716-docker:dockerfile-practice_1.1


        
